<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Muzic62</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-base: #121212;
            --bg-card: #181818;
            --bg-card-hover: #282828;
            --accent: #1db954;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Главный экран */
        .app-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 140px 16px;
        }

        .greeting {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        /* Быстрые карточки сверху (как в Spotify) */
        .quick-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 24px;
        }

        .quick-card {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: background 0.2s;
        }

        .quick-card:active {
            background: rgba(255, 255, 255, 0.2);
        }

        .quick-card img {
            width: 56px;
            height: 56px;
            object-fit: cover;
        }

        .quick-card span {
            font-size: 13px;
            font-weight: 600;
            padding: 0 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        /* Список треков */
        .track-item {
            display: flex;
            align-items: center;
            padding: 8px;
            border-radius: 6px;
