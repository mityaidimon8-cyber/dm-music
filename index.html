<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Muzic62 Hi-Fi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-base: #121212;
            --bg-card: #181818;
            --bg-card-hover: #282828;
            --accent: #1db954;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Основные вкладки */
        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 140px 16px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .greeting {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        /* Сетка быстрого доступа */
        .quick-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 24px;
        }

        .quick-card {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: background 0.2s;
        }

        .quick-card img {
            width: 56px;
            height: 56px;
            object-fit: cover;
        }

        .quick-card span {
            font-size: 13px;
            font-weight: 600;
            padding: 0 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        /* Список треков */
        .track-item {
            display: flex;
            align-items: center;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .track-item:active {
            background-color: var(--bg-card-hover);
        }

        .track-thumb {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            background-color: #333;
            margin-right: 12px;
            object-fit: cover;
        }

        .track-details {
            flex: 1;
            overflow: hidden;
        }

        .track-name {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-author {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hifi-badge {
            background: rgba(29, 185, 84, 0.2);
            color: var(--accent);
            font-size: 10px;
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: 700;
        }

        /* Мини-плеер */
        .mini-player {
            position: fixed;
            bottom: 56px;
            left: 8px;
            right: 8px;
            background: #282828;
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 99;
        }

        .mini-player img {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            object-fit: cover;
            margin-right: 10px;
        }

        .mini-info {
            flex: 1;
            overflow: hidden;
        }

        .mini-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-artist {
            font-size: 12px;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-controls {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-left: 10px;
        }

        .mini-btn {
            background: none;
            border: none;
            cursor: pointer;
            fill: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-circle {
            width: 32px;
            height: 32px;
            background: #fff;
            border-radius: 50%;
            fill: #000;
        }

        /* Полноэкранный плеер */
        .full-player {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #333 0%, #121212 100%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            padding: 24px;
            transform: translateY(100%);
            transition: transform 0.3s ease-in-out;
        }

        .full-player.open {
            transform: translateY(0);
        }

        .fp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .fp-art {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .fp-info {
            margin-bottom: 20px;
        }

        .fp-title {
            font-size: 22px;
            font-weight: 700;
        }

        .fp-artist {
            font-size: 16px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .progress-container {
            width: 100%;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #535353;
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--text-main);
            border-radius: 2px;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 6px;
        }

        .fp-controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 30px;
        }

        /* Эквалайзер */
        .eq-container {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            margin-top: auto;
            margin-bottom: 20px;
        }

        .eq-title {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .eq-sliders {
            display: flex;
            justify-content: space-between;
        }

        .eq-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .eq-col input[type=range] {
            writing-mode: vertical-lr;
            direction: rtl;
            width: 20px;
            height: 60px;
            accent-color: var(--accent);
        }

        .eq-col span {
            font-size: 10px;
            color: var(--text-sub);
        }

        /* Нижняя навигация */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 56px;
            background-color: #181818;
            border-top: 1px solid #282828;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 10px;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--text-main);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>
<body>

        <div class="quick-grid">

                <span>Hi-Fi Хиты</span>
            </div>
        </div>
        <div class="section-title">Рекомендации без цензуры</div>
        <div id="trackList
