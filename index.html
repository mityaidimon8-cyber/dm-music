<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Muzic62 VK Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-base: #121212;
            --bg-card: #181818;
            --bg-card-hover: #282828;
            --accent: #1db954;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 140px 16px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .greeting {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 24px;
        }

        .quick-card {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: background 0.2s;
        }

        .quick-card img {
            width: 56px;
            height: 56px;
            object-fit: cover;
        }

        .quick-card span {
            font-size: 13px;
            font-weight: 600;
            padding: 0 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .track-item {
            display: flex;
            align-items: center;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .track-item:active {
            background-color: var(--bg-card-hover);
        }

        .track-thumb {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            background-color: #333;
            margin-right: 12px;
            object-fit: cover;
        }

        .track-details {
            flex: 1;
            overflow: hidden;
        }

        .track-name {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-author {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .vk-badge {
            background: rgba(0, 119, 255, 0.2);
            color: #4a90e2;
            font-size: 10px;
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: 700;
        }

        /* Мини-плеер */
        .mini-player {
            position: fixed;
            bottom: 56px;
            left: 8px;
            right: 8px;
            background: #282828;
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 99;
        }

        .mini-player img {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            object-fit: cover;
            margin-right: 10px;
        }

        .mini-info {
            flex: 1;
            overflow: hidden;
        }

        .mini-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-artist {
            font-size: 12px;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-controls {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-left: 10px;
        }
